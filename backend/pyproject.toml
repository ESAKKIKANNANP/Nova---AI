# =============================================================================
# pyproject.toml
#
# PEP 621-compliant project manifest managed by `uv`.
#
# Sections:
#   [project]          — package metadata & runtime dependencies
#   [project.optional-dependencies] — dev/test extras
#   [tool.uv]          — uv-specific configuration
#   [tool.ruff]        — linting + formatting (replaces black + isort + flake8)
#   [tool.pytest.ini_options] — test runner config
#   [tool.mypy]        — static type-checking config
# =============================================================================

[project]
name = "autonomous-data-scientist-backend"
version = "0.1.0"
description = "Production-ready FastAPI backend for the Autonomous Data Scientist platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Autonomous Data Scientist Team" }]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies = [
    # Web framework
    "fastapi>=0.111.0,<0.112.0",
    # ASGI server (production: gunicorn manages uvicorn workers)
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "gunicorn>=22.0.0,<23.0.0",
    # Structured logging
    "structlog>=24.1.0",
    # Settings / configuration management (reads .env + environment variables)
    "pydantic-settings>=2.3.0,<3.0.0",
    # HTTP client used in readiness probe and async tests
    "httpx>=0.27.0,<0.28.0",
    # UUID generation helper used by correlation-id middleware
    "uuid-utils>=0.9.0",
    # Database (ORM & Migrations)
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    # Data Science, ML & Visualization
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "shap>=0.45.1",
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "openpyxl>=3.1.2",
    "plotly>=5.22.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-postgres>=3.1.0",
    "xgboost>=3.3.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.10",
    "optuna>=4.9.0",
    "mlflow>=3.14.0",
    "fpdf2>=2.8.7",
    "markdown>=3.10.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "memory-profiler>=0.61.0",
    "python-docx>=1.2.0",
    "websockets>=15.0.1",
    "chromadb>=1.5.9",
    "pypdf>=6.14.2",
    "tiktoken>=0.13.0",
    "langchain-chroma>=1.1.0",
    "python-multipart>=0.0.32",
    "langchain-community>=0.4.2",
    "langchain-openai>=0.1.0",
    "seaborn>=0.13.0",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "arq>=0.28.0",
    "redis>=5.3.1",
    "aiosmtplib>=5.1.2",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.3",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Test runner
    "pytest>=8.2.0",
    # Async test support
    "pytest-asyncio>=0.23.0",
    # Coverage reporting
    "pytest-cov>=5.0.0",
    # Linter + formatter (single tool replaces black + isort + flake8)
    "ruff>=0.4.0",
    # Static type checker
    "mypy>=1.10.0",
    # Stubs for third-party libraries
    "types-ujson>=5.10.0",
]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — replaces deprecated [tool.uv.dev-dependencies]
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "anyio>=4.4.0",
]

# ---------------------------------------------------------------------------
# Build system (required by PEP 517/518)
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling where the application package lives.
# Without this, hatchling can't find the `app` directory because the project
# name (autonomous-data-scientist-backend) doesn't match the package name (app).
[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — unified linter + formatter
# Replaces: black, isort, flake8, pyupgrade
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "ANN101", # missing type annotation for `self`
    "ANN102", # missing type annotation for `cls`
    "S104",   # binding to 0.0.0.0 (required for Docker)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"           # all async test functions are auto-detected
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "integration: marks tests that require external services",
    "unit: marks pure unit tests",
]

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
