# =============================================================================
# pyproject.toml
#
# PEP 621-compliant project manifest managed by `uv`.
#
# Sections:
#   [project]          — package metadata & runtime dependencies
#   [project.optional-dependencies] — dev/test extras
#   [tool.uv]          — uv-specific configuration
#   [tool.ruff]        — linting + formatting (replaces black + isort + flake8)
#   [tool.pytest.ini_options] — test runner config
#   [tool.mypy]        — static type-checking config
# =============================================================================

[project]
name = "autonomous-data-scientist-backend"
version = "0.1.0"
description = "Production-ready FastAPI backend for the Autonomous Data Scientist platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Autonomous Data Scientist Team" }]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------
dependencies = [
    # Web framework
    "fastapi>=0.111.0,<0.112.0",
    # ASGI server (production: gunicorn manages uvicorn workers)
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "gunicorn>=22.0.0,<23.0.0",
    # Structured logging
    "structlog>=24.1.0",
    # Settings / configuration management (reads .env + environment variables)
    "pydantic-settings>=2.3.0,<3.0.0",
    # HTTP client used in readiness probe and async tests
    "httpx>=0.27.0,<0.28.0",
    # UUID generation helper used by correlation-id middleware
    "uuid-utils>=0.9.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    # Test runner
    "pytest>=8.2.0",
    # Async test support
    "pytest-asyncio>=0.23.0",
    # Coverage reporting
    "pytest-cov>=5.0.0",
    # Linter + formatter (single tool replaces black + isort + flake8)
    "ruff>=0.4.0",
    # Static type checker
    "mypy>=1.10.0",
    # Stubs for third-party libraries
    "types-ujson>=5.10.0",
]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ---------------------------------------------------------------------------
# Build system (required by PEP 517/518)
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Ruff — unified linter + formatter
# Replaces: black, isort, flake8, pyupgrade
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "ANN101", # missing type annotation for `self`
    "ANN102", # missing type annotation for `cls`
    "S104",   # binding to 0.0.0.0 (required for Docker)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"           # all async test functions are auto-detected
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "integration: marks tests that require external services",
    "unit: marks pure unit tests",
]

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
