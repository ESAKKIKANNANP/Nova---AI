# =============================================================================
# docker-compose.yml
#
# Local development stack for the FastAPI backend.
#
# Services:
#   api  — FastAPI app with uvicorn hot-reload
#
# Usage:
#   docker compose up          # start in foreground
#   docker compose up -d       # start detached
#   docker compose down -v     # stop and remove volumes
#
# When adding a database (Postgres, Redis, etc.) later, add it as a new
# service here and reference it via environment variables.
# =============================================================================

services:
  api:
    # ── Build config ──────────────────────────────────────────────────────────
    build:
      context: .
      dockerfile: Dockerfile
      # Use the builder stage so dev-dependencies are available if needed.
      target: builder

    # ── Image tag (useful when pushing to a registry) ─────────────────────────
    image: ads-backend:dev

    # ── Container identity ────────────────────────────────────────────────────
    container_name: ads-backend-dev

    # ── Port binding ──────────────────────────────────────────────────────────
    ports:
      - "8000:8000"

    # ── Volume mounts ─────────────────────────────────────────────────────────
    volumes:
      # Mount app source for hot-reload (changes reflect without rebuild).
      - ./app:/app/app:cached
      # Mount the tests directory so you can run pytest inside the container.
      - ./tests:/app/tests:cached

    # ── Environment variables ─────────────────────────────────────────────────
    env_file:
      # Copy .env.example → .env and fill in values before running compose.
      - .env

    environment:
      # Override a few defaults for the local dev container.
      ENV: development
      DEBUG: "true"
      LOG_FORMAT: console
      LOG_LEVEL: DEBUG
      HOST: "0.0.0.0"
      PORT: "8000"

    # ── Development entrypoint (overrides the production CMD in Dockerfile) ───
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/app
        --log-level debug

    # ── Restart policy ────────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Health check (mirrors Dockerfile HEALTHCHECK) ─────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Named volumes (add persistence volumes here as needed) ────────────────────
volumes: {}

# ── Networks (defaults to bridge; override for multi-service isolation) ───────
networks:
  default:
    name: ads-network
